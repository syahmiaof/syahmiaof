<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B100D"/>
      <stop offset="100%" stop-color="#141E18"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131C16"/>
      <stop offset="100%" stop-color="#18241D"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60E1B5"/>
      <stop offset="100%" stop-color="#38B28B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.07" stroke="#60E1B5" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Terminal Window Container -->
  <rect x="50" y="40" width="1100" height="595" rx="16" fill="url(#cardGrad)" stroke="#23352A" stroke-width="2"/>

  <!-- Window Header Bar -->
  <path d="M 50,56 Q 50,40 66,40 L 1134,40 Q 1150,40 1150,56 L 1150,95 L 50,95 Z" fill="#0D1410"/>
  <line x1="50" y1="95" x2="1150" y2="95" stroke="#23352A" stroke-width="1.5"/>

  <!-- Window Controls -->
  <circle cx="80" cy="68" r="7" fill="#FF5F56"/>
  <circle cx="104" cy="68" r="7" fill="#FFBD2E"/>
  <circle cx="128" cy="68" r="7" fill="#27C93F"/>

  <text x="600" y="73" fill="#8EAA9B" font-family="'Fira Code', monospace" font-size="13" text-anchor="middle" letter-spacing="1">
    devops-cloud-lab · bash · 120x36
  </text>

  <!-- Title & Status Header -->
  <g transform="translate(85, 125)">
    <text x="0" y="24" fill="#60E1B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" letter-spacing="0.5">
      DEVOPS &amp; CLOUD INFRASTRUCTURE LAB
    </text>
    <text x="0" y="48" fill="#8EAA9B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
      Automated CI/CD Workflows · Docker Containerization · Linux systemd Services · Cloud Architecture
    </text>

    <!-- Status Badges -->
    <g transform="translate(820, 5)">
      <rect x="0" y="0" width="95" height="24" rx="4" fill="#182B21" stroke="#60E1B5" stroke-width="1"/>
      <circle cx="12" cy="12" r="4" fill="#60E1B5"/>
      <text x="24" y="16" fill="#60E1B5" font-family="'Fira Code', monospace" font-size="11" font-weight="600">PASSING</text>

      <rect x="105" y="0" width="105" height="24" rx="4" fill="#182B21" stroke="#60E1B5" stroke-width="1"/>
      <circle cx="117" cy="12" r="4" fill="#60E1B5"/>
      <text x="129" y="16" fill="#60E1B5" font-family="'Fira Code', monospace" font-size="11" font-weight="600">UPTIME 99.9%</text>
    </g>
  </g>

  <!-- 4 Architecture Pillar Cards -->
  <g transform="translate(85, 205)">
    <!-- Card 1: CI/CD -->
    <rect x="0" y="0" width="240" height="100" rx="8" fill="#0E1712" stroke="#22362A" stroke-width="1.5"/>
    <text x="16" y="28" fill="#60E1B5" font-family="'Fira Code', monospace" font-size="13" font-weight="700">01 / CI_CD_PIPELINE</text>
    <text x="16" y="52" fill="#E1EFEA" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">GitHub Actions</text>
    <text x="16" y="72" fill="#8EAA9B" font-family="-apple-system, sans-serif" font-size="12">Lint · Build · Auto-Deploy</text>
    <text x="16" y="88" fill="#4E6E5D" font-family="'Fira Code', monospace" font-size="10">trigger: on [push, PR]</text>

    <!-- Card 2: Containers -->
    <rect x="260" y="0" width="240" height="100" rx="8" fill="#0E1712" stroke="#22362A" stroke-width="1.5"/>
    <text x="276" y="28" fill="#60E1B5" font-family="'Fira Code', monospace" font-size="13" font-weight="700">02 / CONTAINERS</text>
    <text x="276" y="52" fill="#E1EFEA" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Docker &amp; Compose</text>
    <text x="276" y="72" fill="#8EAA9B" font-family="-apple-system, sans-serif" font-size="12">Multi-stage isolation</text>
    <text x="276" y="88" fill="#4E6E5D" font-family="'Fira Code', monospace" font-size="10">bridge network · healthcheck</text>

    <!-- Card 3: Linux Systems -->
    <rect x="520" y="0" width="240" height="100" rx="8" fill="#0E1712" stroke="#22362A" stroke-width="1.5"/>
    <text x="536" y="28" fill="#60E1B5" font-family="'Fira Code', monospace" font-size="13" font-weight="700">03 / HOST_SYSTEMS</text>
    <text x="536" y="52" fill="#E1EFEA" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Linux &amp; systemd</text>
    <text x="536" y="72" fill="#8EAA9B" font-family="-apple-system, sans-serif" font-size="12">Daemons &amp; unit isolation</text>
    <text x="536" y="88" fill="#4E6E5D" font-family="'Fira Code', monospace" font-size="10">Restart=always · journalctl</text>

    <!-- Card 4: Cloud Edge -->
    <rect x="780" y="0" width="250" height="100" rx="8" fill="#0E1712" stroke="#22362A" stroke-width="1.5"/>
    <text x="796" y="28" fill="#60E1B5" font-family="'Fira Code', monospace" font-size="13" font-weight="700">04 / CLOUD_NETWORK</text>
    <text x="796" y="52" fill="#E1EFEA" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">AWS &amp; Cloudflare</text>
    <text x="796" y="72" fill="#8EAA9B" font-family="-apple-system, sans-serif" font-size="12">VPC, DNS, SSL &amp; Edge</text>
    <text x="796" y="88" fill="#4E6E5D" font-family="'Fira Code', monospace" font-size="10">TLS 1.3 · IAM least-privilege</text>
  </g>

  <!-- Terminal Session Console Box -->
  <g transform="translate(85, 335)">
    <rect x="0" y="0" width="1030" height="260" rx="10" fill="#080D0A" stroke="#1D2D23" stroke-width="1.5"/>

    <g transform="translate(25, 32)" font-family="'Fira Code', monospace" font-size="13">
      <!-- Command 1 -->
      <text x="0" y="0" fill="#60E1B5">$</text>
      <text x="18" y="0" fill="#E1EFEA">docker compose -f docker-compose.prod.yml up -d --build</text>
      
      <text x="0" y="22" fill="#8EAA9B">[+] Building 2.4s (12/12) FINISHED</text>
      <text x="0" y="40" fill="#60E1B5"> ✔ Container app-gateway      Started [healthy]</text>
      <text x="0" y="58" fill="#60E1B5"> ✔ Container worker-service   Started [healthy]</text>
      <text x="0" y="76" fill="#60E1B5"> ✔ Container redis-cache      Started [healthy]</text>

      <!-- Command 2 -->
      <text x="0" y="112" fill="#60E1B5">$</text>
      <text x="18" y="112" fill="#E1EFEA">systemctl status devops-pipeline.service --no-pager</text>

      <text x="0" y="134" fill="#27C93F">●</text>
      <text x="16" y="134" fill="#E1EFEA" font-weight="600">devops-pipeline.service - Production Cloud Service Daemon</text>
      <text x="16" y="152" fill="#8EAA9B">   Loaded: loaded (/etc/systemd/system/devops-pipeline.service; enabled; vendor preset: enabled)</text>
      <text x="16" y="170" fill="#60E1B5">   Active: active (running) since Sat 2026-10-31 08:14:22 UTC; 10h ago</text>
      <text x="16" y="188" fill="#8EAA9B">   Main PID: 14820 (node) · Memory: 84.2M · CPU: 0.8% · Status: "All healthchecks green; 0 packet drops"</text>

      <!-- Cursor -->
      <text x="0" y="214" fill="#60E1B5">$</text>
      <rect x="18" y="202" width="9" height="16" fill="#60E1B5" opacity="0.8"/>
    </g>
  </g>
</svg>
